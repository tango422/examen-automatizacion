name: Pipeline Completo de CI/CD con Rollback Automatizado

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # FASE DE INTEGRACIÓN CONTINUA (CI) - ACTIVIDAD 2
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilar Proyecto (Build)
      run: |
        cd proyecto-pruebas
        mvn clean compile

    - name: Ejecutar Pruebas Automatizadas (Test)
      run: |
        cd proyecto-pruebas
        mvn test

  # FASE DE DESPLIEGUE CONTINUO (CD) Y ROLLBACK - ACTIVIDAD 3
  deploy-and-rollback:
    runs-on: ubuntu-latest
    needs: build-and-test # Garantiza que el software es de calidad antes de desplegar
    
    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 1. Stage de Despliegue (Simulado en entorno de staging)
    - name: Desplegar en Ambiente de Pruebas (Deploy)
      run: |
        echo "Iniciando despliegue automatizado en el entorno de staging..."
        echo "Software empaquetado y subido exitosamente a Staging v1.0.0."

    # 2. Stage de Pruebas de Aceptacion (Exigido por la pauta)
    - name: Ejecutar Pruebas de Aceptacion (Acceptance Tests)
      run: |
        echo "Ejecutando suite de acceptance tests sobre el entorno desplegado..."
        cd proyecto-pruebas
        mvn test -Dtest=AcceptanceTest
        echo "Pruebas de aceptacion aprobadas con exito."

    # 3. Mecanismo de Rollback (Se activa SOLO si algun paso anterior falla)
    - name: Mecanismo de Rollback de Emergencia
      if: failure() # Condición lógica exclusiva de GitHub Actions
      run: |
        echo "ALERTA CRÍTICA: Despliegue inestable detectado."
        echo "Iniciando rollback de emergencia a la ultima version estable..."
        echo "Rollback completado con exito. Entorno restaurado de forma segura."